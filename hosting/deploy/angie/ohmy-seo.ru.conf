acme_client le_ohmyseo https://acme-v02.api.letsencrypt.org/directory;

# ohmy-seo.ru + mcp.ohmy-seo.ru -> docker compose stack on loopback.
# Angie terminates TLS and obtains certificates via the built-in ACME client.

server {
    listen 80;
    listen [::]:80;
    server_name ohmy-seo.ru www.ohmy-seo.ru mcp.ohmy-seo.ru;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    server_name www.ohmy-seo.ru;

    acme le_ohmyseo;
    ssl_certificate     $acme_cert_le_ohmyseo;
    ssl_certificate_key $acme_cert_key_le_ohmyseo;

    return 301 https://ohmy-seo.ru$request_uri;
}

server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    server_name ohmy-seo.ru;

    acme le_ohmyseo;
    ssl_certificate     $acme_cert_le_ohmyseo;
    ssl_certificate_key $acme_cert_key_le_ohmyseo;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 16m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    listen [::]:443 ssl;
    listen [::]:443 quic;
    server_name mcp.ohmy-seo.ru;

    acme le_ohmyseo;
    ssl_certificate     $acme_cert_le_ohmyseo;
    ssl_certificate_key $acme_cert_key_le_ohmyseo;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MCP streams responses; buffering would defeat Streamable HTTP and a
        # long tool call must not be cut off at the default 60s.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }
}
